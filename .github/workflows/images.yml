name: images
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  packages: write
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        engine: [vllm, llamacpp, speaches, gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o geniusrise ./cmd/geniusrise
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/${{ matrix.engine }}/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.engine }}:latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/${{ matrix.engine }}/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.engine }}:${{ github.sha }}
